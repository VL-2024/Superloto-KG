<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ЧҮКӨ v19</title>
<style>html,body{margin:0;min-height:100%;background:#041a41;color:#fff;font-family:system-ui}#s{padding:24px;text-align:center}</style>
</head>
<body><div id="s">Загрузка ЧҮКӨ v19…</div>
<script>
(async()=>{
  try{
    const files=Array.from({length:8},(_,i)=>`v19final/part${String(i).padStart(2,'0')}.txt?v=19`);
    const parts=[];
    for(const file of files){
      const r=await fetch(file,{cache:'no-store'});
      if(!r.ok) throw new Error(file+' HTTP '+r.status);
      parts.push(await r.text());
    }
    const html=parts.join('');
    if(!html.includes('X2_GAME_DEPOSIT_REQUEST')||!html.includes('MODE_SWITCH')) throw new Error('v19 validation failed');
    document.open();
    document.write(html);
    document.close();
  }catch(e){
    console.error(e);
    document.getElementById('s').textContent='Ошибка загрузки v19. Обновите страницу.';
  }
})();
</script></body></html>
