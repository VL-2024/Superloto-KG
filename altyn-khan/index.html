<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#031831">
<title>АЛТЫН ХАН — X2 LOTO</title>
<style>html,body{margin:0;min-height:100%;background:#020f22;color:#fff;font-family:Arial,sans-serif}body{display:flex;align-items:center;justify-content:center}.loading{opacity:.75;font-size:14px}</style>
</head>
<body><div class="loading">Загрузка АЛТЫН ХАН…</div>
<script>
(async()=>{
  try{
    const names=['part00.txt','part01.txt','part02.txt','part03.txt','part04.txt','part05.txt','part06.txt'];
    const chunks=await Promise.all(names.map(n=>fetch('parts/'+n,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error(n+' '+r.status);return r.text()})));
    document.open();document.write(chunks.join(''));document.close();
  }catch(e){document.body.innerHTML='<div class="loading">Ошибка загрузки игры: '+String(e.message||e)+'</div>';console.error(e)}
})();
</script>
</body>
</html>
